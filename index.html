<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>세상의 모든 것 그리기!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { color-scheme: light only; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #fff6d5, #ffe0f0, #dff3ff);
    overflow: hidden;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #mission {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #fff;
    border-radius: 16px;
    margin: 6px auto 0;
    padding: 6px 10px;
    width: min(96%, 700px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    flex-wrap: wrap;
  }
  #missionEmoji { font-size: clamp(24px, 5vw, 36px); }
  #missionName { font-size: clamp(16px, 3.6vw, 22px); font-weight: bold; color: #444; }
  .miniBtn {
    border: none;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: clamp(12px, 2.4vw, 15px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  #stars {
    background: #fff8e0;
    border-radius: 12px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(12px, 2.4vw, 15px);
    color: #d98c00;
  }
  #nextBtn { background: #ffe27a; }
  #doneBtn { background: #a5ffb0; }
  #guideBtn { background: #ddd1ff; }
  #guideBtn.off { background: #eee; color: #999; }
  .miniBtn:active { transform: translateY(2px); box-shadow: none; }

  #canvasWrap {
    flex: 1;
    margin: 6px 8px;
    border-radius: 18px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    position: relative;
  }
  #zoomLayer {
    position: absolute;
    inset: 0;
    transform-origin: 0 0;
  }
  #guide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(60vh, 60vw);
    line-height: 1;
    filter: opacity(0.35);
    pointer-events: none;
  }
  #canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; }
  #zoomReset {
    position: absolute;
    top: 8px; left: 8px;
    z-index: 5;
    display: none;
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: bold;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #zoomBtns {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #zoomBtns button {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #zoomBtns button:active { transform: scale(0.92); }

  #toolbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 5px 6px 8px;
    max-width: 100vw;
  }
  #colors, #bgs, #toolRow {
    display: flex;
    flex-wrap: nowrap;
    max-width: 100%;
    gap: 6px;
    background: #fff;
    padding: 5px 8px;
    border-radius: 14px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    align-items: center;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #colors::-webkit-scrollbar, #bgs::-webkit-scrollbar, #toolRow::-webkit-scrollbar { display: none; }
  #bgs::before {
    content: "🖼️";
    font-size: 16px;
  }
  .bgswatch {
    flex: 0 0 auto;
    width: 34px; height: 30px;
    border-radius: 8px;
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px #ddd;
    cursor: pointer;
    background-size: cover;
    background-position: center;
  }
  .bgswatch.selected { box-shadow: 0 0 0 3px #333; }
  .swatch {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px #ddd;
    cursor: pointer;
  }
  .swatch.selected { box-shadow: 0 0 0 3px #333; }

  #sizes, #actions {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    align-items: center;
  }
  .sizeBtn {
    flex: 0 0 auto;
    border: none;
    background: #f1f1f1;
    border-radius: 8px;
    width: 30px; height: 30px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sizeBtn.selected { background: #ffd166; }
  .sizeDot { border-radius: 50%; background: #333; }
  #toolDivider { width: 2px; height: 24px; background: #eee; border-radius: 2px; flex: 0 0 auto; }
  #actions button {
    flex: 0 0 auto;
    border: none;
    border-radius: 10px;
    padding: 4px 8px;
    font-size: 17px;
    cursor: pointer;
    background: #f1f1f1;
  }
  #actions button:active { transform: translateY(2px); }
  #eraserBtn.selected { background: #cde8ff; }

  #toast {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #fff;
    padding: 20px 30px;
    border-radius: 24px;
    font-size: clamp(24px, 6vw, 40px);
    font-weight: bold;
    color: #ff5fa2;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 50;
    text-align: center;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #picker {
    position: fixed;
    inset: 0;
    background: rgba(255, 250, 240, 0.98);
    z-index: 40;
    display: none;
    flex-direction: column;
  }
  #picker.open { display: flex; }
  #pickerHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  #pickerHead h2 {
    margin: 0;
    font-size: clamp(18px, 4.5vw, 26px);
    color: #ff5fa2;
  }
  #pickerClose {
    border: none;
    background: #ffe27a;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  #pickerBody {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .pickGroup {
    margin: 14px 4px 6px;
    font-size: clamp(15px, 3.5vw, 20px);
    font-weight: bold;
    color: #666;
  }
  .pickGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
  }
  .pickCard {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    padding: 10px 4px 8px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .pickCard:active { transform: translateY(2px); box-shadow: none; }
  .pickEmoji { font-size: 38px; line-height: 1.15; }
  .pickName { font-size: 12px; font-weight: bold; color: #555; margin-top: 2px; word-break: keep-all; }
  #pickBtn { background: #ffc9de; }
</style>
</head>
<body>
<div id="app">
  <div id="mission">
    <span id="missionEmoji">🐶</span>
    <span id="missionName">강아지</span>
    <button class="miniBtn" id="pickBtn">그림책 📖</button>
    <button class="miniBtn" id="nextBtn">다음 그림 🔄</button>
    <button class="miniBtn" id="doneBtn">다 그렸어요! ✅</button>
    <button class="miniBtn" id="guideBtn">밑그림 👻</button>
    <span id="stars">⭐ <span id="starCount">0</span></span>
  </div>

  <div id="canvasWrap">
    <div id="zoomLayer">
      <div id="guide">🐶</div>
      <canvas id="canvas"></canvas>
    </div>
    <button id="zoomReset">🔍 원래대로</button>
    <div id="zoomBtns">
      <button id="zoomIn">➕</button>
      <button id="zoomOut">➖</button>
    </div>
  </div>

  <div id="toolbar">
    <div id="bgs" title="배경 고르기"></div>
    <div id="colors"></div>
    <div id="toolRow">
      <div id="sizes"></div>
      <div id="toolDivider"></div>
      <div id="actions">
        <button id="eraserBtn" title="지우개">🧽</button>
        <button id="undoBtn" title="되돌리기">↩️</button>
        <button id="clearBtn" title="전체 지우기">🗑️</button>
        <button id="saveBtn" title="저장하기">💾</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="picker">
  <div id="pickerHead">
    <h2>📖 뭘 그려볼까? 눌러서 골라요!</h2>
    <button id="pickerClose">닫기 ✖</button>
  </div>
  <div id="pickerBody"></div>
</div>

  // ---------- 그릴 것 목록: 주제별 배경과 짝지음 ----------

  const MISSIONS = [];

  const COLORS = [

  // ---------- 상태 ----------
  let currentColor = "#000000";
  let currentSize = 8;
  let isEraser = false;
  let drawing = false;

  // ---------- 캔버스 초기화 ----------
  const canvas = document.getElementById("canvas");
  const wrap = document.getElementById("canvasWrap");
  const ctx = canvas.getContext("2d");

  function setupCanvas(){
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();

  function clearCanvas(){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const ratio = rect.width / canvas.offsetWidth;
    return { x: (e.clientX - rect.left) / ratio, y: (e.clientY - rect.top) / ratio };
  }

  // ---------- 확대(핀치 줌) ----------
  const zoomLayer = document.getElementById("zoomLayer");
  const zoomReset = document.getElementById("zoomReset");
  let view = { s: 1, tx: 0, ty: 0 };
  function clampView(){
    const W = wrap.clientWidth, H = wrap.clientHeight;
    view.s = Math.min(4, Math.max(1, view.s));
    view.tx = Math.min(0, Math.max(W - W * view.s, view.tx));
    view.ty = Math.min(0, Math.max(H - H * view.s, view.ty));
  }
  function applyView(){
    clampView();
    zoomLayer.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.s + ")";
    zoomReset.style.display = view.s > 1.01 ? "block" : "none";
  }
  function resetView(){
    view = { s: 1, tx: 0, ty: 0 };
    applyView();
  }
  zoomReset.addEventListener("click", resetView);
  function zoomBy(factor){
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const cx = W / 2, cy = H / 2;
    const s2 = Math.min(4, Math.max(1, view.s * factor));
    view.tx = cx - ((cx - view.tx) / view.s) * s2;
    view.ty = cy - ((cy - view.ty) / view.s) * s2;
    view.s = s2;
    applyView();
  }
  document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.5));
  document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.5));

  // ---------- undo ----------
  let undoStack = [];
  function saveUndoState(){
    try {
      undoStack.push(canvas.toDataURL());
      if (undoStack.length > 20) undoStack.shift();
    } catch(e){}
  }
  function undo(){
    if (undoStack.length === 0) return;
    const dataUrl = undoStack.pop();
    const img = new Image();
    img.onload = function(){
      const rect = wrap.getBoundingClientRect();
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width, canvas.height);
      ctx.restore();
      ctx.drawImage(img, 0, 0, rect.width, rect.height);
    };
    img.src = dataUrl;
  }

  // ---------- 그리기 ----------
  function strokeWidth(){ return isEraser ? currentSize * 2 : currentSize; }

  function startDraw(e){
    saveUndoState();
    drawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
    ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";
    ctx.fillStyle = currentColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, strokeWidth()/2, 0, Math.PI*2);
    ctx.fill();
  }
  function moveDraw(e){
    if (!drawing) return;
    const p = getPos(e);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = strokeWidth();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function endDraw(){
    drawing = false;
    ctx.globalCompositeOperation = "source-over";
  }

  // 손가락 1개 = 그리기, 손가락 2개 = 확대/이동
  const pointers = new Map();
  let pinch = null;

  function pinchPoints(){
    const arr = [...pointers.values()];
    return [arr[0], arr[1]];
  }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  canvas.addEventListener("pointerdown", (e)=>{
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      startDraw(e);
    } else if (pointers.size === 2) {
      if (drawing) {           // 그리던 선 취소하고 확대 모드로
        drawing = false;
        ctx.globalCompositeOperation = "source-over";
        undo();
      }
      const [a, b] = pinchPoints();
      pinch = { d0: dist(a, b), m0: mid(a, b), s0: view.s, tx0: view.tx, ty0: view.ty };
    }
  });
  canvas.addEventListener("pointermove", (e)=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) {
      const [a, b] = pinchPoints();
      const wrapRect = wrap.getBoundingClientRect();
      const m = mid(a, b);
      const s = Math.min(4, Math.max(1, pinch.s0 * dist(a, b) / pinch.d0));
      const m0x = pinch.m0.x - wrapRect.left, m0y = pinch.m0.y - wrapRect.top;
      const mx = m.x - wrapRect.left, my = m.y - wrapRect.top;
      view.s = s;
      view.tx = mx - ((m0x - pinch.tx0) / pinch.s0) * s;
      view.ty = my - ((m0y - pinch.ty0) / pinch.s0) * s;
      applyView();
    } else if (drawing) {
      moveDraw(e);
    }
  });
  function liftPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drawing) endDraw();
  }
  canvas.addEventListener("pointerup", liftPointer);
  canvas.addEventListener("pointercancel", liftPointer);
  canvas.addEventListener("pointerleave", (e)=>{ if (drawing) liftPointer(e); });

  document.getElementById("saveBtn").addEventListener("click", () => {
    const out = document.createElement("canvas");
    out.width = canvas.width;
    out.height = canvas.height;
    const octx = out.getContext("2d");
    const img = new Image();
    img.onload = function(){
      const vw = 400, vh = 700;
      const scale = Math.max(out.width / vw, out.height / vh);
      const dw = vw * scale, dh = vh * scale;
      octx.drawImage(img, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
      octx.drawImage(canvas, 0, 0);
      const link = document.createElement("a");
      const name = document.getElementById("missionName").textContent;
      const date = new Date().toISOString().slice(0,10);
      link.download = `내그림_${name}_${date}.png`;
      link.href = out.toDataURL("image/png");
      link.click();
    };
    img.src = "data:image/svg+xml," + encodeURIComponent(SCENES[currentBg].svg);

  // ---------- 미션(그릴 것) ----------
  function glyphCount(str){
    try {
      return [...new Intl.Segmenter("ko", { granularity: "grapheme" }).segment(str)].length;
    } catch(e) { return 1; }
  }
  function setMission(idx){
    missionIndex = idx;

    resetView();
  }
  function pickMission(){
    let idx;
    do {
      idx = Math.floor(Math.random() * MISSIONS.length);
    } while (idx === missionIndex && MISSIONS.length > 1);
    setMission(idx);
  }
  document.getElementById("nextBtn").addEventListener("click", () => {
    clearCanvas();
    undoStack = [];

    room: "🧸 내 방"
  };
  const picker = document.getElementById("picker");
  const pickerBody = document.getElementById("pickerBody");
  (function buildPicker(){
    let idx = 0;
    Object.keys(GROUPS).forEach(k => {
      const title = document.createElement("div");
      title.className = "pickGroup";
      title.textContent = GROUP_TITLES[k] || k;
      pickerBody.appendChild(title);
      const grid = document.createElement("div");
      grid.className = "pickGrid";
      GROUPS[k].forEach(m => {
        const cardIdx = idx;
        const card = document.createElement("div");
        card.className = "pickCard";
        card.innerHTML = '<div class="pickEmoji">' + m[0] + '</div><div class="pickName">' + m[1] + '</div>';
        card.addEventListener("click", () => {
          picker.classList.remove("open");
          clearCanvas();
          undoStack = [];
          setMission(cardIdx);
          showToast(m[0] + " " + m[1] + " 그리기!");
        });
        grid.appendChild(card);
        idx++;
      });
      pickerBody.appendChild(grid);
    });
  })();
  document.getElementById("pickBtn").addEventListener("click", () => {
    picker.classList.add("open");
  });
  document.getElementById("pickerClose").addEventListener("click", () => {
    picker.classList.remove("open");
  });

  // ---------- 밑그림(따라 그리기) 켜기/끄기 ----------
  const guideBtn = document.getElementById("guideBtn");
  guideBtn.addEventListener("click", () => {
    const guide = document.getElementById("guide");
    const off = guide.style.display === "none";
    guide.style.display = off ? "flex" : "none";
    guideBtn.classList.toggle("off", !off);
    showToast(off ? "👻 밑그림 켜기!" : "밑그림 숨기기!");
  });

  function showToast(text){
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1100);
  }

  document.getElementById("doneBtn").addEventListener("click", () => {
    stars += 1;
    localStorage.setItem("worldDrawGame_stars", String(stars));
    document.getElementById("starCount").textContent = stars;
    showToast("정말 잘 그렸어요! 🎉⭐");
    setTimeout(() => {
      clearCanvas();
      undoStack = [];
      pickMission();
    }, 1200);
  });

  // ---------- 시작 ----------
  document.getElementById("starCount").textContent = stars;
  pickMission();
  setTimeout(() => showToast("두 손가락으로 벌리면 확대! 🔍"), 800);
})();
</script>
</body>
</html>
